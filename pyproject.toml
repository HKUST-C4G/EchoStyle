[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["E501", "E741"]
select = ["I", "F401"]

[tool.ruff.lint.per-file-ignores]
# Ignore import violations in all `__init__.py` files.
"__init__.py" = ["F401"]

[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wan_trainer"
version = "0.1.0"
description = "Trainer for Wan series models"
readme = "README.md"
dependencies = [
  "termcolor",
  "decord",
  "wandb",
  "tensorboard",
  "moviepy==1.0.3",
  "peft",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "opencv-python>=4.9.0.80",
  "diffusers>=0.31.0",
  "transformers>=4.49.0",
  "tokenizers>=0.20.3",
  "accelerate>=1.1.1",
  "tqdm",
  "imageio",
  "easydict",
  "ftfy",
  "dashscope",
  "imageio-ffmpeg",
  "flash_attn",
  "gradio>=5.0.0",
  "numpy>=1.23.5,<2",
]

[tool.setuptools.packages.find]
include = ["trainer*"]
exclude = ["datasets*"]
